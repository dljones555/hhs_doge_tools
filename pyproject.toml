[project]
name = "hhs-doge-tools"
version = "0.1.0"
description = "Medicaid provider spending fraud analysis tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.scripts]
city-extract = "hhs_doge_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hhs_doge_tools"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
